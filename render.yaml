# Déploiement sur Render (https://render.com) : "New +" > "Blueprint" > choisir ce dépôt.
# Les valeurs marquées "sync: false" sont demandées une fois dans l'interface Render (jamais dans le code).
# Voir DEPLOIEMENT.md pour les étapes complètes.

services:
  # ── API (NestJS) ──────────────────────────────────────────
  - type: web
    name: gsmpro-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres
      - key: DB_SSL
        value: true
      - key: DB_SYNC
        value: false
      - key: CORS_ORIGIN
        sync: false # adresse du site, ex: https://gsmpro-app.onrender.com

  # ── Site (Angular, fichiers statiques) ────────────────────
  - type: web
    name: gsmpro-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build && node scripts/write-config.js
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_URL
        sync: false # adresse de l'API, ex: https://gsmpro-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
