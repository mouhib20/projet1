# Déploiement sur Render (https://render.com) : "New +" > "Blueprint" > choisir ce dépôt.
# Un seul service sert le site ET l'API (une seule adresse), avec sa base PostgreSQL gratuite.
# Au premier démarrage, les tables et le compte admin sont créés automatiquement.
# Render demande une seule valeur : SEED_ADMIN_PASSWORD. Voir DEPLOIEMENT.md.

databases:
  - name: gsmpro-db
    databaseName: gsmpro
    user: gsmpro
    plan: free

services:
  - type: web
    name: gsmpro
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend install --include=dev && npm --prefix frontend run build && npm --prefix backend install --include=dev && npm --prefix backend run build
    startCommand: cd backend && node dist/main
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gsmpro-db
          property: connectionString
      - key: DB_SSL
        value: true
      - key: DB_SYNC
        value: false
      - key: AUTO_INIT_DB
        value: true
      - key: SERVE_FRONTEND
        value: true
      - key: SEED_ADMIN_PASSWORD
        sync: false # mot de passe du compte "admin" (10 caractères minimum) : à choisir vous-même
