<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>GSM Pro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <link rel="icon" type="image/png" href="icons/icon-32x32.png">
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <script>
    window.onerror = function (msg, src, lineno, colno, err) {
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:99999;font-size:16px;white-space:pre-wrap;';
      errorDiv.innerText = 'L\'erreur JavaScript de votre App: \n\n' + msg + '\n' + (err ? err.stack : '');
      document.body.appendChild(errorDiv);
    };
    window.addEventListener('unhandledrejection', function (event) {
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'position:fixed;top:30%;left:0;right:0;background:darkred;color:white;padding:20px;z-index:99999;font-size:16px;white-space:pre-wrap;';
      errorDiv.innerText = 'L\'erreur Promise de votre App: \n\n' + (event.reason ? event.reason.stack || event.reason : 'Unknown reason');
      document.body.appendChild(errorDiv);
    });
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
